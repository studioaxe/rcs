name: Rental Calendar Sync - Full Auto

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Origem do disparo'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize calendars (Airbnb + Booking + Vrbo)
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
          BUFFER_DAYS_BEFORE: ${{ secrets.BUFFER_DAYS_BEFORE }}
          BUFFER_DAYS_AFTER: ${{ secrets.BUFFER_DAYS_AFTER }}
        run: python sync.py

      - name: Verify generated files
        run: |
          echo "=== import_calendar.ics ==="
          [ -f import_calendar.ics ] && wc -l import_calendar.ics || echo "NAO ENCONTRADO"
          echo "=== master_calendar.ics ==="
          [ -f master_calendar.ics ] && wc -l master_calendar.ics || echo "NAO ENCONTRADO"

      - name: Commit and push updated calendars
        run: |
          git config user.name "Rental Calendar Sync Bot"
          git config user.email "noreply@github.com"
          git add import_calendar.ics master_calendar.ics
          if git diff --cached --quiet; then
            echo "Sem alteracoes de calendario para commit."
          else
            git commit -m "Auto-sync calendars ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin main
            echo "Push efetuado - isto aciona o workflow Publish Master Calendar."
          fi
