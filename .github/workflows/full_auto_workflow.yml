name: Rental Calendar Sync - Full Auto

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Origem do disparo"
        required: false
        default: "auto"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronize calendars
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
          BUFFER_DAYS_BEFORE: ${{ secrets.BUFFER_DAYS_BEFORE }}
          BUFFER_DAYS_AFTER: ${{ secrets.BUFFER_DAYS_AFTER }}
        run: python sync.py

      - name: Commit updated calendars
        run: |
          git config user.name "Rental Calendar Sync Bot"
          git config user.email "noreply@github.com"

          git add import_calendar.ics master_calendar.ics

          if git diff --cached --quiet; then
            echo "Sem alterações de calendário para commit."
          else
            git commit -m "Auto-sync calendars ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin main
            echo "Calendários atualizados no repositório."
          fi

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public

          cp master_calendar.ics public/master_calendar.ics

          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-PT">
            <head>
              <meta charset="utf-8">
              <title>Rental Calendar Sync</title>
            </head>
            <body>
              <p>
                <a href="master_calendar.ics">
                  master_calendar.ics
                </a>
              </p>
            </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy master calendar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
