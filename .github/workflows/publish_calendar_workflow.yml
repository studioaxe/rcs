name: Publish Master Calendar

on:
  push:
    branches:
      - main
    paths:
      - master_calendar.ics
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: master-calendar-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public calendar
        run: |
          mkdir -p public
          cp master_calendar.ics public/master_calendar.ics

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload calendar artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
